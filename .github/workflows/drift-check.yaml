name: Automated Drift Check

on:
  schedule:
    - cron: '0 0 * * *'  # ⏰ Runs automatically every day at midnight UTC
  workflow_dispatch:     # 👈 Adds a "Run workflow" button in GitHub Actions UI

jobs:
  run-drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas evidently requests

      - name: Run Drift Check Script
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_REPO: "jianthe1/mlops-continuous-retraining-platform"
        run: |
          python drift-check.py