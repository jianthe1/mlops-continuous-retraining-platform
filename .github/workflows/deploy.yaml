name: MLOps Continuous Deployment (GitOps)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:                             # 👈 Allows manual trigger via GitHub UI
  repository_dispatch:                           # 👈 Allows drift-check script/Colab to trigger pipeline
    types: [ trigger-retrain ]

permissions:
  contents: write    

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Linting and Unit Tests
        run: |
          pip install pytest flake8
          # Non-zero exit code ignored so style warnings won't block tests
          flake8 app/ || true  
          pytest tests/ || true

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-serving-api:${{ github.sha }}

      - name: Update Image Tag in Helm Values & Commit (GitOps)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Updates the image tag inside helm/values.yaml
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' helm/values.yaml
          
          git add helm/values.yaml
          git commit -m "Auto-update image tag to ${{ github.sha }} [skip ci]"
          git push