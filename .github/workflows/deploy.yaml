name: Continuous Training and Deployment Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/values.yaml'
      - 'README.md'
  repository_dispatch:
    types: [trigger-retrain]
  workflow_dispatch:

jobs:
  build-train-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Model Retraining
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          # Executes training script if present in repo
          if [ -f train.py ]; then python train.py; fi

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mlops-serving-api:latest
            ghcr.io/${{ github.repository_owner }}/mlops-serving-api:sha-${{ github.sha }}

      - name: Update Helm Image Tag for Argo CD
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Update repository and tag in helm/values.yaml
          sed -i 's|repository: .*|repository: ghcr.io/${{ github.repository_owner }}/mlops-serving-api|g' helm/values.yaml
          sed -i 's|tag: .*|tag: "sha-${{ github.sha }}"|g' helm/values.yaml
          
          # 2. Stage changes
          git add helm/values.yaml
          
          # 3. Pull latest remote changes cleanly
          git pull --rebase --autostash origin main
          
          # 4. Commit and push back to GitHub
          if ! git diff-index --quiet HEAD --; then
            git commit -m "ci(deploy): update image tag to sha-${{ github.sha }} [skip ci]"
            git push origin main
          else
            echo "No changes to commit in helm/values.yaml"
          fi