apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-k8s-reader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-k8s-reader-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes", "namespaces", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-k8s-reader-binding
subjects:
  - kind: ServiceAccount
    name: mcp-k8s-reader
    namespace: default
roleRef:
  kind: ClusterRole
  name: mcp-k8s-reader-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mcp-server
  namespace: default
  labels:
    app: k8s-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-mcp-server
  template:
    metadata:
      labels:
        app: k8s-mcp-server
    spec:
      serviceAccountName: mcp-k8s-reader
      # Uncomment if your GHCR repository is Private:
      # imagePullSecrets:
      #   - name: ghcr-secret
      containers:
        - name: mcp-server
          image: ghcr.io/jianthe1/k8s-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: sse-port
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-mcp-service
  namespace: default
  labels:
    app: k8s-mcp-server
spec:
  type: ClusterIP
  selector:
    app: k8s-mcp-server
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      name: http-sse